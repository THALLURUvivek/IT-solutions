<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>body{margin:0;}</style>
</head>
<body class="dash-body">
<div class="dash-shell">
  <div class="dash-main">
    <header class="d-topbar">
      <div class="d-topbar-actions">
        <div class="dropdown">
          <button class="d-user-btn"><span class="d-avatar">MR</span><div><strong>Client</strong><small>client@nexora.io</small></div><i class="bi bi-chevron-down"></i></button>
          <!-- inline styles mimic what Popper writes at runtime -->
          <ul class="dropdown-menu dropdown-menu-end d-user-menu show" style="position:absolute; left:auto; top:auto; transform:translate(0px,42px); margin:0px; will-change:transform;">
            <li><span class="dropdown-header px-2">Signed in as</span></li>
            <li><button class="dropdown-item" type="button" disabled><i class="bi bi-person-circle"></i> <span>client@nexora.io</span></button></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-globe2"></i> Back to website</a></li>
            <li><a class="dropdown-item danger" href="#"><i class="bi bi-box-arrow-right"></i> Sign Out</a></li>
          </ul>
        </div>
      </div>
    </header>
    <div class="d-content" style="padding:40px">
      <h1>Body content behind the sheet</h1>
      <p>Used to prove the scrim dims the page and the sheet is pinned to the viewport.</p>
    </div>
  </div>
</div>
</body>
</html>
