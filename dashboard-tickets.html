<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — Nexora Dashboard</title>
    <meta name="theme-color" content="#0a0e27">
    <link rel="icon" href="images/image.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Inter", system-ui, sans-serif;
            background: radial-gradient(ellipse at top, #0f1538, #05081d 70%);
            color: #fff;
        }
        .wrap { text-align: center; padding: 24px; }
        .spinner {
            width: 44px; height: 44px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 3px solid rgba(108, 92, 231, 0.25);
            border-top-color: #9d4dff;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #aab2d6; font-size: 0.92rem; }
        a { color: #00d4ff; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="spinner"></div>
        <p>Taking you to your dashboard…</p>
        <noscript>
            <p>Please <a href="dashboard-projects.html#support">click here</a> to continue.</p>
        </noscript>
    </div>
    <script>
        window.location.replace('dashboard-projects.html#support');
    </script>
</body>
</html>
